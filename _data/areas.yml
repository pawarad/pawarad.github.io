- title: Production agentic systems
  text: Agents and assistants built to find things in cancer genomics data, with every answer traceable. A web assistant answers questions about a patient cohort in plain English, with every number coming from a reviewed query and every answer showing its source. A vision-language agent curates copy number solutions in minutes instead of hours.

- title: GPU bioinformatics
  text: Bringing the lab's pipelines into Nextflow so they run the same way every time, and building new ones for L40S GPUs with Parabricks. On the modeling side, the biggest GPU win is rarely a faster single run. It is running dozens of starting points in parallel so the model stops getting stuck in poor solutions.

- title: Copy number and ctDNA algorithms
  text: Extending ichorCNA and TITAN to work across many samples at once and to behave on low tumor fraction cell-free DNA, with better initialization, denser allele-frequency panels and sensible bin sizes.

- title: Computational biology
  text: Structural variant calling, mutational signatures, and models that connect cell-free DNA methylation to gene expression. Most of it starts with making the BAMs, the references and the metadata trustworthy.
